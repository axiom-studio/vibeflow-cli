name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# The axiom-studio org Actions policy only allows actions from org-owned
# repositories, so this workflow uses no `uses:` steps. Checkout, Go
# toolchain setup, and GoReleaser all run as plain shell commands.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q .
          # Auth via a transient http.extraHeader passed per-command — never
          # written to .git/config, so the token is not left on the runner FS
          # for later steps to read.
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')" \
            fetch -q --prune --tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD

      - name: Set up Go
        run: |
          GO_VERSION="$(awk '$1 == "go" {print $2}' go.mod)"
          GO_TARBALL="go${GO_VERSION}.linux-amd64.tar.gz"
          # Verify the toolchain tarball against the SHA256 go.dev publishes in
          # its download manifest before extracting. The toolchain compiles the
          # release binaries, so a tampered tarball would backdoor every
          # artifact. Fetching the hash (vs. hardcoding) keeps the check working
          # when go.mod bumps the Go version. Fails closed on mismatch.
          GO_SHA256="$(curl -fsSL 'https://go.dev/dl/?mode=json&include=all' \
            | jq -r --arg f "$GO_TARBALL" '.[].files[] | select(.filename == $f) | .sha256')"
          if [ -z "$GO_SHA256" ]; then
            echo "::error::no published SHA256 for ${GO_TARBALL} in go.dev manifest" >&2
            exit 1
          fi
          curl -fsSL "https://go.dev/dl/${GO_TARBALL}" -o /tmp/go.tgz
          echo "${GO_SHA256}  /tmp/go.tgz" | sha256sum -c -
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf /tmp/go.tgz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          /usr/local/go/bin/go version

      - name: Install GoReleaser
        # Pinned to an exact reviewed version (not @latest) so a compromised
        # upstream tag can't be auto-adopted into a release build. Bump
        # deliberately via PR.
        run: go install github.com/goreleaser/goreleaser/v2@v2.16.0

      # Validate the signing key BEFORE anything is published (issue #4394).
      #
      # v1.0.24 was published and then failed to sign, because this check did not
      # exist and the signing step runs after GoReleaser. That left a
      # published-but-unsigned release. Since SIGNED_FROM_TAG is now set, a repeat
      # would be worse than untidy: the installer refuses a signed-era release with
      # no signature, so the release would be UNINSTALLABLE.
      #
      # Failing here costs nothing — no tag artifacts exist yet, so the operator
      # fixes the secret and re-tags.
      - name: Validate the signing key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "::warning::RELEASE_SIGNING_KEY is not set — this release will be published UNSIGNED." \
                 "Installers with a pinned key REFUSE unsigned signed-era releases, so this" \
                 "release may be uninstallable. See npx/SIGNING.md."
            exit 0
          fi

          key="$(mktemp)"; chmod 600 "$key"
          trap 'rm -f "$key" "$key.pub"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"

          # Distinguish the failure modes instead of emitting one generic openssl
          # error. The v1.0.24 incident was flattened newlines, and the message at
          # the time blamed the operator's key file, which was in fact correct.
          if grep -q 'BEGIN PUBLIC KEY' "$key"; then
            echo "::error::RELEASE_SIGNING_KEY contains a PUBLIC key. It must be the PRIVATE half" \
                 "(-----BEGIN PRIVATE KEY-----). The public half belongs in" \
                 "RELEASE_SIGNING_PUBLIC_KEY in npx/index.js." >&2
            exit 1
          fi
          if ! grep -q 'BEGIN PRIVATE KEY' "$key"; then
            echo "::error::RELEASE_SIGNING_KEY does not look like a PEM private key — no" \
                 "'-----BEGIN PRIVATE KEY-----' header found. Re-set it from the key file:" \
                 "gh secret set RELEASE_SIGNING_KEY < your-key.pem" >&2
            exit 1
          fi
          if [ "$(wc -l < "$key")" -lt 2 ]; then
            echo "::error::RELEASE_SIGNING_KEY is a single line — its newlines were lost," \
                 "which openssl reports only as 'Could not read private key'. This happens when" \
                 "a multi-line PEM is pasted into the web secret field. Re-set it from the file" \
                 "instead: gh secret set RELEASE_SIGNING_KEY < your-key.pem" >&2
            exit 1
          fi
          if ! openssl pkey -in "$key" -noout 2>/dev/null; then
            echo "::error::openssl cannot read RELEASE_SIGNING_KEY as a private key — the PEM is" \
                 "present but malformed or truncated. Re-set it from the key file." >&2
            exit 1
          fi

          alg="$(openssl pkey -in "$key" -noout -text 2>/dev/null | head -1)"
          case "$alg" in
            *ED25519*) : ;;
            *) echo "::error::RELEASE_SIGNING_KEY is not Ed25519 ($alg). The installer verifies with" \
                    "crypto.verify(null, ...), which assumes Ed25519." >&2; exit 1 ;;
          esac

          # Prove it can actually sign and self-verify, so the only way the later
          # signing step can fail is an infrastructure problem, not the key.
          echo "preflight" > "$key.data"
          openssl pkey -in "$key" -pubout -out "$key.pub" 2>/dev/null
          openssl pkeyutl -sign -inkey "$key" -rawin -in "$key.data" -out "$key.sig" 2>/dev/null \
            && openssl pkeyutl -verify -pubin -inkey "$key.pub" -rawin -in "$key.data" -sigfile "$key.sig" >/dev/null 2>&1 \
            || { echo "::error::the key parsed but could not sign+verify a test payload" >&2; exit 1; }
          rm -f "$key.data" "$key.sig"

          echo "signing key validated: Ed25519, signs and self-verifies."

      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean

      # Sign checksums.txt so the npx installer can verify AUTHENTICITY, not just
      # integrity: checksums.txt otherwise comes from the same origin as the
      # archive it describes, so replacing both defeats the hash check
      # (issue #4349, finding #403).
      #
      # Deliberately a post-release step rather than a goreleaser `signs` block:
      # this way it is conditional in plain shell, so a release still succeeds
      # before RELEASE_SIGNING_KEY exists. Action-free per the org policy; `gh` is
      # preinstalled on ubuntu-latest.
      - name: Sign checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "::warning::RELEASE_SIGNING_KEY is not set — publishing this release UNSIGNED." \
                 "The installer will verify checksums but cannot prove authenticity." \
                 "See npx/SIGNING.md for the one-time setup."
            exit 0
          fi

          sums="dist/checksums.txt"
          [ -f "$sums" ] || { echo "::error::$sums not found after goreleaser" >&2; exit 1; }

          # Key material goes to a 0600 file under the runner's own temp dir, and
          # is removed on exit whether signing succeeds or fails.
          key="$(mktemp)"
          chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$RELEASE_SIGNING_KEY" > "$key"

          # Raw Ed25519 over the exact bytes of checksums.txt. -rawin means no
          # prehash, which is what Node's crypto.verify(null, ...) expects.
          openssl pkeyutl -sign -inkey "$key" -rawin -in "$sums" -out "$sums.sig" || {
            echo "::error::signing failed — is RELEASE_SIGNING_KEY a valid Ed25519 PEM?" >&2
            exit 1
          }

          # Self-check before publishing: verify with the derived public key so a
          # broken signature is caught here rather than by users.
          openssl pkey -in "$key" -pubout -out "$key.pub"
          openssl pkeyutl -verify -pubin -inkey "$key.pub" -rawin -in "$sums" -sigfile "$sums.sig" \
            || { echo "::error::self-verification of the new signature failed" >&2; exit 1; }
          rm -f "$key.pub"

          gh release upload "${GITHUB_REF_NAME}" "$sums.sig" --clobber
          echo "Uploaded checksums.txt.sig ($(wc -c < "$sums.sig") bytes) for ${GITHUB_REF_NAME}."
