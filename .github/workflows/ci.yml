name: CI

on:
  pull_request:
    branches: [main]

# Read-only: CI only tests pull requests. Builds happen only on tags — the
# GoReleaser build + publish (which needs contents: write) lives in
# release.yml and runs on tag pushes only.
permissions:
  contents: read

# The axiom-studio org Actions policy only allows actions from org-owned
# repositories, so these workflows use no `uses:` steps. Checkout, Go
# toolchain setup, and GoReleaser all run as plain shell commands.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q .
          # Auth via a transient http.extraHeader passed per-command — never
          # written to .git/config, so the token is not left on the runner FS
          # for later steps to read.
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')" \
            fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD

      - name: Set up Go
        run: |
          GO_VERSION="$(awk '$1 == "go" {print $2}' go.mod)"
          GO_TARBALL="go${GO_VERSION}.linux-amd64.tar.gz"
          # Verify the toolchain tarball against the SHA256 go.dev publishes in
          # its download manifest before extracting. The toolchain compiles the
          # release binaries, so a tampered tarball would backdoor every
          # artifact. Fetching the hash (vs. hardcoding) keeps the check working
          # when go.mod bumps the Go version. Fails closed on mismatch.
          GO_SHA256="$(curl -fsSL 'https://go.dev/dl/?mode=json&include=all' \
            | jq -r --arg f "$GO_TARBALL" '.[].files[] | select(.filename == $f) | .sha256')"
          if [ -z "$GO_SHA256" ]; then
            echo "::error::no published SHA256 for ${GO_TARBALL} in go.dev manifest" >&2
            exit 1
          fi
          curl -fsSL "https://go.dev/dl/${GO_TARBALL}" -o /tmp/go.tgz
          echo "${GO_SHA256}  /tmp/go.tgz" | sha256sum -c -
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf /tmp/go.tgz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          /usr/local/go/bin/go version

      - name: Gofmt
        run: |
          # Fail if any Go source file is not gofmt-clean. `go vet` does not
          # catch formatting, so without this gate unformatted code passes CI
          # (issue #3163). Scoped to the source roots (matches the fix command
          # below and avoids scanning untracked local dirs). Action-free shell
          # per the org Actions policy (see header comment / #2716).
          unformatted="$(gofmt -l cmd internal sessionid)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files (run: gofmt -w cmd internal sessionid):" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Installer unit tests
        run: |
          # Pure-helper tests for npx/index.js via the built-in node:test runner
          # (no dependencies to install). Name the file explicitly: passing the
          # directory makes the runner treat index.js itself as a test and
          # execute the installer. Node is preinstalled on ubuntu-latest.
          command -v node >/dev/null 2>&1 || {
            echo "::error::node is not on PATH; the installer unit tests need it" >&2
            exit 1
          }
          # Both suites, named explicitly: the directory form matches index.js
          # itself and would execute the installer. signed-release.test.js spawns
          # child processes against a per-run throwaway keypair — no network, no
          # production key. (issue #4389.)
          node --test npx/index.test.js npx/signed-release.test.js

  # Real-Windows smoke test for the npx installer (issue #4339). Everything else
  # about the Windows path was only ever verified by simulating
  # process.platform='win32' on Linux, which cannot exercise the final
  # `vibeflow.exe bootstrap` spawn, %APPDATA% resolution, or the genuine
  # Expand-Archive fallback. This job closes that gap.
  #
  # No secrets: `bootstrap` only writes config files and never contacts the
  # server, so a placeholder key is sufficient and nothing sensitive enters CI.
  #
  # Action-free per the org Actions policy. Node is preinstalled on the
  # windows-latest image; the job asserts that rather than assuming it. bash is
  # available via Git for Windows.
  windows-installer-smoke:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')" \
            fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD

      - name: Check prerequisites
        run: |
          command -v node >/dev/null 2>&1 || {
            echo "::error::node is not on PATH on windows-latest; the smoke test needs it" >&2
            exit 1
          }
          node --version
          # Confirm the System32 helpers the installer resolves absolutely
          # (see systemRootBin in npx/index.js) actually exist on this image.
          for exe in "System32/tar.exe" "System32/where.exe" \
                     "System32/WindowsPowerShell/v1.0/powershell.exe"; do
            p="${SYSTEMROOT:-C:/Windows}/$exe"
            if [ ! -f "$p" ]; then echo "note: missing $p (installer has a fallback)"; fi
          done

      - name: Run the installer end-to-end
        run: |
          # Resolves the latest release via the unauthenticated GitHub API (60
          # req/hr per IP). If this ever flakes on a shared runner IP, pin the
          # tag with --version <tag>, which skips the API call entirely.
          # 2>&1 is load-bearing: warn() writes to STDERR while step()/ok() write
          # to stdout. Capturing stdout alone made the WSL assertion below
          # impossible to satisfy, and made the tmux assertion vacuous — it
          # matched "==> Checking for tmux", which step() prints on every
          # platform before any branch is taken, so it would still have passed if
          # ensureTmux were made fatal. That is the regression this is meant to
          # catch. (issue #4368, QA reopen.)
          out="$(node npx/index.js --api-key "smoke-test-not-a-real-key" --agents claude-desktop,claude-cli 2>&1)"
          echo "$out"

          # Assert on text that ONLY the warn-not-fail branch emits — never on
          # the step header, which is printed unconditionally.
          echo "$out" | grep -q 'tmux is not available on Windows' || {
            echo "::error::the warn-not-fail path did not run; ensureTmux may have become fatal" >&2
            exit 1
          }
          # Match 'WSL' rather than the closing summary's exact wording: the
          # ensureTmux notice is emitted unconditionally on Windows, whereas the
          # closing line only prints on a fully successful run. 'WSL' appears in
          # no other output, so this still discriminates.
          echo "$out" | grep -q 'WSL' || {
            echo "::error::Windows tmux notice should point at WSL" >&2; exit 1
          }

      - name: Assert the installed binary runs on Windows
        run: |
          bin="$USERPROFILE/.vibeflow/bin/vibeflow.exe"
          [ -f "$bin" ] || { echo "::error::$bin was not installed" >&2; exit 1; }
          # This is the step no simulation could cover: actually executing the
          # PE binary.
          "$bin" version

      - name: Assert the Claude Desktop config landed under %APPDATA%
        run: |
          cfg="$APPDATA/Claude/claude_desktop_config.json"
          [ -f "$cfg" ] || { echo "::error::$cfg was not written" >&2; exit 1; }
          cat "$cfg"
          # The token belongs in the env block and must never reach argv.
          grep -q 'mcp-remote' "$cfg" || { echo "::error::mcp-remote bridge missing" >&2; exit 1; }
          grep -q 'MCP_TOKEN' "$cfg" || { echo "::error::MCP_TOKEN reference missing" >&2; exit 1; }
          if grep -q '"args"' "$cfg" && grep -A6 '"args"' "$cfg" | grep -q 'smoke-test-not-a-real-key'; then
            echo "::error::raw token leaked into argv" >&2; exit 1
          fi

      # bootstrap.go behaviour must be asserted against a binary built from THIS
      # commit. `node npx/index.js` downloads the latest PUBLISHED release, which
      # predates the changes under review — so assertions about resolveNpxCommand
      # (#4336) or setupInitialConfig idempotence (#4342) were testing the wrong
      # build: one failed for the right reason, the other passed for the wrong
      # one. (issue #4393.)
      - name: Build vibeflow from source and assert bootstrap behaviour
        run: |
          command -v go >/dev/null 2>&1 || {
            echo "::error::go is not on PATH on windows-latest; needed to test THIS commit" >&2
            exit 1
          }
          go version
          go build -o "$RUNNER_TEMP/vibeflow.exe" ./cmd/vibeflow

          root="$RUNNER_TEMP/vfroot"; rm -rf "$root"; mkdir -p "$root"
          run1="$("$RUNNER_TEMP/vibeflow.exe" bootstrap --api-key "smoke-test-not-a-real-key" \
                  --agents claude-desktop --root "$root" 2>&1)"
          echo "$run1"

          # #4342: an identical re-run must report the vibeflow-cli config as
          # unchanged and write no new backup. Assert on the config.yaml LINE, not
          # on any 'unchanged' anywhere in the output.
          run2="$("$RUNNER_TEMP/vibeflow.exe" bootstrap --api-key "smoke-test-not-a-real-key" \
                  --agents claude-desktop --root "$root" 2>&1)"
          echo "$run2"
          echo "$run2" | grep -E 'vibeflow-cli .*\(unchanged\)' >/dev/null || {
            echo "::error::identical re-run should report config.yaml as (unchanged)" >&2; exit 1
          }
          # Count backups BEFORE and AFTER the no-op run. Asserting the dir is
          # empty would be wrong: the first run legitimately backs up any config
          # it genuinely changes. What must not happen is a NEW backup from a run
          # that changed nothing.
          before="$(ls -1 "$root/.backup" 2>/dev/null | wc -l | tr -d ' ')"
          run3="$("$RUNNER_TEMP/vibeflow.exe" bootstrap --api-key "smoke-test-not-a-real-key" \
                  --agents claude-desktop --root "$root" 2>&1)"
          after="$(ls -1 "$root/.backup" 2>/dev/null | wc -l | tr -d ' ')"
          echo "backups before=$before after=$after"
          [ "$before" = "$after" ] || {
            echo "::error::a no-op re-run wrote $((after-before)) new backup(s) of the token-bearing config" >&2
            exit 1
          }

      # The plain job above never reaches Expand-Archive: windows-latest ships
      # bsdtar as System32\tar.exe, which reads zip, so the first extractor always
      # wins. That leaves the PowerShell fallback — the branch that carried
      # CWE-426 (#4337) and the one a Git-Bash tar makes mainline — with zero real
      # coverage. Force it by making System32\tar.exe unusable for this step only.
      # (issue #4368.)
      - name: Force the Expand-Archive fallback and re-verify
        run: |
          set -u
          root="${SYSTEMROOT:-C:/Windows}"
          tar_exe="$root/System32/tar.exe"
          if [ ! -f "$tar_exe" ]; then
            echo "::notice::no System32 tar.exe on this image; the fallback is already the only path"
          fi

          # Point SystemRoot at a directory that has System32\WindowsPowerShell
          # but NO tar.exe. systemRootBin then returns null for tar and resolves
          # powershell.exe normally, so extraction can only succeed via
          # Expand-Archive. This avoids touching the real System32.
          shim="$RUNNER_TEMP/shimroot"
          rm -rf "$shim"
          mkdir -p "$shim/System32/WindowsPowerShell/v1.0"
          cp "$root/System32/WindowsPowerShell/v1.0/powershell.exe" \
             "$shim/System32/WindowsPowerShell/v1.0/powershell.exe"
          cp "$root/System32/where.exe" "$shim/System32/where.exe" 2>/dev/null || true

          rm -rf "$USERPROFILE/.vibeflow/bin"
          SystemRoot="$(cygpath -w "$shim" 2>/dev/null || echo "$shim")" \
            node npx/index.js --api-key "smoke-test-not-a-real-key" --agents claude-desktop

          bin="$USERPROFILE/.vibeflow/bin/vibeflow.exe"
          [ -f "$bin" ] || {
            echo "::error::Expand-Archive fallback failed to produce $bin" >&2; exit 1
          }
          "$bin" version
          echo "Expand-Archive fallback verified end-to-end."

  # macOS leg (issue #4368). macOS was only ever stub-verified, and it is the
  # only place resolveNpxCommand's premise can actually be exercised: Claude
  # Desktop is a GUI app that inherits the launchd environment rather than the
  # shell PATH, which is why #4336 pins an absolute npx path. On a real Mac,
  # `command` must come out absolute — that assertion is impossible to make
  # anywhere else.
  #
  # Shares the POSIX code path with Linux, so this is a platform check rather
  # than a second full behavioural suite. Action-free; no secrets.
  macos-installer-smoke:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')" \
            fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD

      - name: Check prerequisites
        run: |
          command -v node >/dev/null 2>&1 || {
            echo "::error::node is not on PATH on macos-latest" >&2; exit 1
          }
          node --version
          # bsdtar is the macOS tar; confirm it handles our .tar.gz with -xzf,
          # the flag the POSIX branch uses since #4338.
          tar --version | head -1

      - name: Run the installer end-to-end
        run: |
          # 2>&1: warn() is on stderr (see the Windows leg's note, issue #4368).
          out="$(node npx/index.js --api-key "smoke-test-not-a-real-key" --agents claude-desktop,claude-cli 2>&1)"
          echo "$out"
          # macOS runners ship tmux, so the INSTALLED branch is the one to pin
          # here — the mirror of the Windows warn-not-fail assertion.
          echo "$out" | grep -qE 'tmux already installed|tmux installed' || {
            echo "::error::tmux step did not report a usable tmux on macOS" >&2; exit 1
          }

      - name: Assert the darwin binary runs
        run: |
          bin="$HOME/.vibeflow/bin/vibeflow"
          [ -x "$bin" ] || { echo "::error::$bin missing or not executable" >&2; exit 1; }
          file -b "$bin"
          "$bin" version

      - name: Assert the installed release wrote a Desktop config at the macOS path
        run: |
          # This asserts what the DOWNLOADED release does — path resolution and the
          # token contract, both true of any version. Behaviour introduced in this
          # PR is asserted in the next step, against a source build. (issue #4393.)
          cfg="$HOME/Library/Application Support/Claude/claude_desktop_config.json"
          [ -f "$cfg" ] || { echo "::error::$cfg was not written" >&2; exit 1; }
          cat "$cfg"
          node -e "
            const c=require('$cfg').mcpServers.vibeflow;
            const key='smoke-test-not-a-real-key';
            if (c.args.some(a => String(a).includes(key))) {
              console.error('::error::raw token leaked into argv'); process.exit(1);
            }
            if (c.env.MCP_TOKEN !== key) {
              console.error('::error::env.MCP_TOKEN missing'); process.exit(1);
            }
            if (!c.args.join(' ').includes('mcp-remote')) {
              console.error('::error::mcp-remote bridge missing'); process.exit(1);
            }
          "

      # The reason the macOS leg exists (#4368): resolveNpxCommand's premise is
      # that a GUI-launched Claude Desktop inherits the launchd PATH, so `command`
      # must be an absolute path. That can only be checked on a real Mac — and only
      # against a binary built from THIS commit, since the published release
      # predates the change.
      - name: Build vibeflow from source and assert the absolute npx path
        run: |
          command -v go >/dev/null 2>&1 || {
            echo "::error::go is not on PATH on macos-latest; needed to test THIS commit" >&2
            exit 1
          }
          go version
          go build -o "$RUNNER_TEMP/vibeflow" ./cmd/vibeflow

          root="$RUNNER_TEMP/vfroot"; rm -rf "$root"; mkdir -p "$root"
          "$RUNNER_TEMP/vibeflow" bootstrap --api-key "smoke-test-not-a-real-key" \
            --agents claude-desktop --root "$root" 2>&1 | tail -5

          cfg="$HOME/Library/Application Support/Claude/claude_desktop_config.json"
          cmd="$(node -e "process.stdout.write(require('$cfg').mcpServers.vibeflow.command)")"
          echo "command = $cmd"
          case "$cmd" in
            /*) echo "absolute npx path resolved — #4336 contract holds on macOS" ;;
            npx)
              # The documented fallback. Legitimate only if npx genuinely is not
              # resolvable; on a runner with Node installed it should be, so this
              # means exec.LookPath failed and is worth knowing about.
              echo "::error::command is the bare-'npx' fallback, but npx should be resolvable here:" >&2
              echo "  which npx -> $(command -v npx || echo '<not found>')" >&2
              echo "  PATH      -> $PATH" >&2
              exit 1 ;;
            *) echo "::error::command is neither absolute nor the documented fallback: $cmd" >&2; exit 1 ;;
          esac
